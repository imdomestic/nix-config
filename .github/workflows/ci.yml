# 四个 job:
#
#   flake-check           整个 flake 求值一遍 + 求值警告门禁 + inventory 概览
#   ci-matrix             从 flake 的 `ciMatrix` 输出读出要检查哪些 host
#   check-configurations  每台 host 一个 --dry-run + 自己那份 deploy schema,
#                         顺便量出闭包体积;矩阵由 ci-matrix 喂进来
#   summary               把上面每台的数字汇总成一张表,贴在 run 页面上
#
# **host 名单不在这个文件里。** 它由 flake.nix 的 ciMatrix 生成 —— 这里手抄过
# 一份,结果 h310/marble/alex 三台漂在名单外没人发现。
#
# 和 cachix.yml 的分工不变:那边只在 main 上跑**真构建**并推缓存,这里全是
# 求值和 dry-run,PR 也跑。
name: flake-check

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  # ---------------------------------------------------------------------------
  # 整个 flake 求值一遍。矩阵那边是逐台 host,漏掉的东西不少:
  # homeConfigurations(70 个)、systemConfigs、deploy.nodes 的 schema、
  # packages 输出。`nix flake check` 全覆盖。
  #
  # 2026-08-12 加这个 job 的直接原因:它一直是红的而没人知道 ——
  # homeConfigurations."hosts/x86_64-headless/hank" 在求值期抛断言
  # (ghostty 的 systemd.enable vs package = null),而矩阵里没有 headless 那两台,
  # 所以 CI 一路绿灯。
  # ---------------------------------------------------------------------------
  flake-check:
    name: nix flake check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 私有 flake input(kvim / wezterm-config / wg-config)要用。
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}

      # 这个 job 要在一个进程里把整个 fleet 求值一遍 —— 21 个 nixosConfigurations
      # + 4 个 darwin + 70 个 home,外加 deploy schema 把它们再展开一次。
      # ubuntu-latest 是 16 GiB,实测很贴边(2026-08-12 那次 --all-systems 直接
      # OOM)。给块 swap 兜底:换页比被 SIGTERM 强,而且这活是求值不是构建,
      # 慢一点无所谓。
      #
      # 放 /mnt —— runner 上那块盘比 / 大得多,而 / 上默认已经有一个 /swapfile。
      - name: 加 swap
        run: |
          sudo fallocate -l 12G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h

      # **必须排在 flake check 前面。**
      #
      # h610 引的 inputs.max 是 cabal2nix 生成的 Haskell 包,也就是说**求值它
      # 之前必须先把 cabal2nix-max 构建出来**(import-from-derivation)。而
      # `--no-build` 恰恰不肯建,于是直接报:
      #
      #   error: path '/nix/store/...-cabal2nix-max.drv' is not valid
      #   … while realising the context of path '/nix/store/...-cabal2nix-max'
      #   … pkgs/development/haskell-modules/make-package-set.nix
      #
      # 本地跑不出来这个错 —— 那条路径早就在 store 里了,`--no-build` 根本不需要
      # 建。只有干净的 runner 才会撞上(2026-08-12 第一次跑就挂在这)。
      #
      # `--dry-run` 是允许 IFD 的(矩阵里 h610 那个 job 一直绿就是证据),拿它把
      # IFD 的产物预热进 store。它自己不构建 h610 的闭包,所以很快。
      #
      # 以后别处再冒出 IFD,症状一样("path ... is not valid"),在这儿多加一台
      # 的 dry-run 即可。仓库里 IFD 是显式开着的,见 nixos/modules/nix-settings.nix
      # 的 allow-import-from-derivation。
      - name: 预热 IFD(h610 的 cabal2nix)
        run: nix build .#nixosConfigurations.h610.config.system.build.toplevel --dry-run

      # --no-build:这里只要求值通过。真正的构建归 cachix.yml 和下面的 dry-run。
      #
      # **--all-systems 现在是安全的,但 2026-08-12 到 08-15 之间不是** —— 那段时间
      # 加上它 runner 会直接 OOM(exit 143),死在
      # `checking derivation checks.aarch64-linux.deploy-schema...`。原因是当时
      # `checks` 是 deploy-rs 的 `deployChecks self.deploy`:求值它等于把整个
      # deploy.nodes 展开一遍(全部 nixosConfigurations 的 activate 包**加上**全部
      # homeConfigurations 的),--all-systems 让这件事按 4 个 system 各来一遍。
      #
      # 08-15 把 deploy check 拆成每台一个、挪去非标准输出 `deployChecks` 之后,
      # 这个负担就没了(见 docs/incidents.md#deploy-schema-timeout),于是 --all-systems
      # 重新加了回来。**它现在覆盖的是 packages.aarch64-linux(rpi4 内核、
      # mihomo-smart、templar 内核)和 packages.aarch64-darwin(字体)** —— 这些
      # cachix.yml 会原生构建,但那个 workflow 只在 main 上跑,PR 上是空的。
      #
      # 实测代价:本地 21.5s -> 1m08s,而 CI 上只贵 2 秒(2m46s -> 2m48s)。
      # runner 的 store 是干净的、本来就要拉 nixpkgs,多求值几个包摊进去可以忽略
      # —— 本地量出来的相对增量不能直接外推到 CI。
      #
      # nix 把进度和警告都写 stderr,所以 2>&1。
      - name: nix flake check
        run: |
          set -o pipefail
          nix flake check --no-build --all-systems 2>&1 | tee /tmp/flake-check.log

      # 求值警告门禁。**只拦新出现的**,已知的上游警告放行 —— 否则这一步从第一天
      # 起就是红的,然后所有人开始无视它(和告警疲劳一个道理)。
      #
      # 白名单一行一条正则,理由写在各自上面。**上游修好之后把对应那条删掉**,
      # 别让它一直挂着 —— 白名单越长这个门禁越没用。
      - name: 求值警告门禁
        run: |
          cat > /tmp/allow.raw <<'ALLOW'
          # home-manager 生成 home-configuration.nix(5) 手册页时,用
          # builtins.derivation 引 nixpkgs 源码没带 string context。
          # 每个 home 配置一条,当前 22 条。
          named 'options\.json'

          # hackintosh。26.05 是最后一个支持 x86_64-darwin 的 nixpkgs,
          # flake.nix 的 packages 输出里已经记过这件事。
          x86_64-darwin

          # 来自 inputs.noctalia 的 nixosModule。溯源(2026-08-12 实测):只有
          # b650 / gpd / m16 报,而 x470 同样是 base+desktop 却不报 —— 三者与
          # x470 的唯一差别就是 externalModules 里的 noctalia。单独求值
          # inputs.noctalia.packages.x86_64-linux.default 不报,所以在模块导入
          # 路径上,不是包本身。本仓库自己那处 prev.system 已在
          # nixos/modules/nix.nix 修掉,和这条无关。
          renamed to/replaced by 'stdenv\.hostPlatform\.system'

          # deploy / deployChecks / hosts / systemConfigs 不是 nix 认识的标准 flake
          # 输出,nix 只会说一句"没检查"。
          #
          # **deployChecks 是故意放在这里的**,不是遗漏:它原本叫 checks,而
          # `nix flake check` 会把 checks 里每一个都求值,于是一个进程扛下全部 9 个
          # 节点 / 35 个 profile,加了 h310 之后直接把 runner 撑爆
          # (见 docs/incidents.md#deploy-schema-timeout)。现在改成每台一个、由下面
          # 矩阵 job 各验各的 —— 覆盖面没减,反而多了 home。
          #
          # 两条都要:本地(nix 2.34)打的是汇总形式,CI 上打的是每个输出一行。
          # 光配一条会在另一边漏网 —— 2026-08-12 实测就是这么被绊住的。
          The following flake outputs are unchecked
          unknown flake output

          # nix 自己的 git 缓存(~/.cache/nix/gitv3)在做 mtime 维护时的抱怨,
          # 只在干净 runner 上出现(那个目录是新建的)。和求值结果无关。
          could not update mtime for file

          # 只在本地脏工作树上出现,CI 里 actions/checkout 是干净的。放行是为了
          # 让人本地跑同一条命令时结果一致。
          Git tree .* has uncommitted changes

          ALLOW
          sed -e 's/^[[:space:]]*//' -e '/^#/d' -e '/^$/d' /tmp/allow.raw > /tmp/allow.txt

          grep -E "^(evaluation )?warning:" /tmp/flake-check.log \
            | grep -vEf /tmp/allow.txt > /tmp/new-warnings.log || true

          if [ -s /tmp/new-warnings.log ]; then
            echo "::error::出现了新的求值警告(白名单见本 workflow)"
            sort -u /tmp/new-warnings.log
            {
              echo "### ❌ 新的求值警告"
              echo '```'
              sort -u /tmp/new-warnings.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "没有新的求值警告"

      # host registry 的概览。纯求值,不碰构建 —— 想知道"现在到底管着哪些机器、
      # 谁被部署、谁被监控",看这张表比翻 nixos/hosts/ 快。
      #
      # 判据和运行时用的是同一个来源:tsIp 决定是否可部署 + 是否被抓
      # (lib/mkInventory.nix、lib/mkDeployNodes.nix),roles 决定跑不跑监控
      # (nixos/modules/monitoring)。
      - name: Inventory 概览
        run: |
          nix eval --json --impure --expr '
            let
              f = builtins.getFlake (toString ./.);
              lib = f.inputs.nixpkgs.lib;
            in lib.mapAttrsToList (n: h: {
              name = n;
              system = h.system or "-";
              kind = h.kind or "nixos";
              tsIp = h.tsIp or "";
              roles = h.roles or [];
              users = lib.attrNames (h.users or {});
            }) f.hosts
          ' > /tmp/inventory.json

          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          hosts = sorted(json.load(open("/tmp/inventory.json")), key=lambda h: (h["kind"], h["name"]))
          print("## Inventory\n")
          print(f"共 {len(hosts)} 台。**可部署 / 被监控** = 有 tsIp（`lib/mkInventory.nix` 的唯一判据）。\n")
          print("| host | system | kind | tsIp | roles | users |")
          print("| --- | --- | --- | --- | --- | --- |")
          for h in hosts:
              ts = f"`{h['tsIp']}`" if h["tsIp"] else "—"
              users = ", ".join(h["users"]) or "—"
              print(f"| **{h['name']}** | {h['system']} | {h['kind']} | {ts} | {', '.join(h['roles']) or '—'} | {users} |")
          deployable = [h for h in hosts if h["tsIp"] and h["kind"] == "nixos"]
          monitors = [h for h in hosts if "monitor" in h["roles"]]
          gw = [h for h in hosts if "monitor-gateway" in h["roles"]]
          print(f"\n- 可部署（`deploy.nodes`）：**{len(deployable)}** 台 — {', '.join(h['name'] for h in deployable)}")
          print(f"- 跑监控（`roles` 含 `monitor`）：{', '.join(h['name'] for h in monitors) or '无'}")
          print(f"- Grafana 入口（`monitor-gateway`）：{', '.join(h['name'] for h in gw) or '无'}")
          PY

  # ---------------------------------------------------------------------------
  # 矩阵从 flake 生成,不再手抄。
  #
  # 2026-08-15 之前 ci.yml 里躺着一份 17 条的 include 列表,而它已经漂了:
  # h310 / marble / alex 三台从来没进过矩阵 —— 其中 h310 正是把 nix flake check
  # 撑爆的那台。加机器的人改了 nixos/hosts 却没人记得改 workflow,这种漂移不靠
  # 纪律能防住,只能靠让它没法漂。
  #
  # 规则写在 flake.nix 的 ciMatrix 输出里(哪些跳过、哪个 system 用哪个 runner),
  # 这里只负责把它读出来喂给 GitHub。
  # ---------------------------------------------------------------------------
  ci-matrix:
    name: 生成矩阵
    runs-on: ubuntu-latest
    outputs:
      include: ${{ steps.gen.outputs.include }}
    steps:
      - uses: actions/checkout@v4
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
      - name: 从 flake 读矩阵
        id: gen
        run: |
          set -euo pipefail
          include=$(nix eval --json .#ciMatrix)
          echo "include=$include" >> "$GITHUB_OUTPUT"
          # 也贴进 summary,免得要点进这个 job 才知道这轮跑了哪几台。
          python3 - <<PY >> "$GITHUB_STEP_SUMMARY"
          import json
          m = json.loads('''$include''')
          print(f"## CI 矩阵（{len(m)} 台，由 \`.#ciMatrix\` 生成）\n")
          print("| host | arch | runner |")
          print("| --- | --- | --- |")
          for e in sorted(m, key=lambda e: (e["os"], e["host"])):
              print(f"| **{e['host']}** | {e['arch']} | \`{e['os']}\` |")
          PY

  # ---------------------------------------------------------------------------
  # 逐台 host 的 dry-run。除了"能不能构建"之外,顺便把闭包体积量出来 ——
  # runner 是干净的 store,所以 dry-run 报的 "unpacked" 基本就是这台的
  # system closure 大小。这样闭包涨了在 PR 里直接看得见,不用等部署完再
  # ssh 上去 `nix path-info -S`。
  # ---------------------------------------------------------------------------
  check-configurations:
    needs: ci-matrix
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.ci-matrix.outputs.include) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 这里原本有一步 `docker/setup-qemu-action`,条件是 arch == aarch64 ——
      # 那是 aarch64 还跑在 x86 runner 上时用来装 binfmt 的。2026-08-15 换成原生
      # ubuntu-24.04-arm 之后就是纯浪费(给一台 arm64 机器装 arm64 模拟),删掉。
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      # Linux runners: the classic installer is proven for these jobs。
      # aarch64 那几台跑在原生 arm64 runner(ubuntu-24.04-arm,公开仓库免费)上,
      # 所以**不需要** extra-platforms —— 那行原本是给 x86 runner 上的 binfmt 用的。
      # cachix.yml 早就是原生 ARM 了(那边是真构建,注释里记着 QEMU 慢 5-20 倍、
      # 会撞 6 小时上限),这里跟它统一。
      #
      # 这个 job 只跑 --dry-run,本来就不构建,所以换 runner 不是为了提速,是为了
      # 拆雷:哪天某台 aarch64 的配置引入 IFD,x86 runner 上会静默用 QEMU 去编,
      # 慢得莫名其妙。
      - name: Install Nix (Linux)
        if: runner.os == 'Linux'
        uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}

      # macOS runners ship a build group / _nixbld users, which makes the
      # classic installer abort with eDSRecordAlreadyExists. The Determinate
      # installer handles pre-existing installs cleanly.
      - name: Install Nix (macOS)
        if: runner.os == 'macOS'
        uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}

      - name: Build (Dry Run)
        id: dryrun
        run: |
          set -euo pipefail
          echo "Checking configuration for host: ${{ matrix.host }}..."
          if [ "${{ runner.os }}" = "macOS" ]; then
            attr='.#darwinConfigurations."${{ matrix.host }}".system'
          else
            attr='.#nixosConfigurations."${{ matrix.host }}".config.system.build.toplevel'
          fi
          # dry-run 的报告走 stderr。--print-out-paths 让 stdout 只有输出路径,
          # 两条流分开存,解析的时候不会串。
          nix build "$attr" --dry-run \
            >/tmp/out.txt 2>/tmp/dry.txt || { cat /tmp/dry.txt; exit 1; }
          cat /tmp/dry.txt

          # 三个数字都可能缺席:全部命中缓存时没有 "will be built",
          # 全部已在本地时没有 "will be fetched"。缺了就填 0 / —。
          build=$(grep -oE 'these [0-9]+ derivations will be built' /tmp/dry.txt \
                  | grep -oE '[0-9]+' | head -1 || true)
          if [ -z "$build" ] && grep -q 'this derivation will be built' /tmp/dry.txt; then
            build=1
          fi
          fetch=$(grep -oE 'these [0-9]+ paths will be fetched' /tmp/dry.txt \
                  | grep -oE '[0-9]+' | head -1 || true)
          size=$(grep -oE '\([0-9.]+ [KMG]iB download, [0-9.]+ [KMG]iB unpacked\)' /tmp/dry.txt \
                 | head -1 | tr -d '()' || true)

          # runner 的 store 是干净的,所以 "unpacked" 约等于这台的 system closure。
          printf '| **%s** | %s | %s | %s | %s |\n' \
            '${{ matrix.host }}' '${{ matrix.arch }}' \
            "${build:-0}" "${fetch:-0}" "${size:-—}" > /tmp/row.md
          cat /tmp/row.md

      # 这台的 deploy schema。**放在这一步而不是 flake-check job 里**,因为上面
      # 那步已经把这台的 toplevel 求值过了,顺手验自己这一个节点几乎不要钱;而
      # `deployChecks self.deploy` 是一个进程扛下全部 9 个节点 / 35 个 profile,
      # 2026-08-15 加了 h310 之后就撑爆 runner —— 完整经过见
      # docs/incidents.md#deploy-schema-timeout。
      #
      # 输出在 flake 的 `deployChecks` 而不是 `checks`,正是为了让
      # `nix flake check` 不去碰它。
      #
      # 矩阵覆盖的机器比 deploy 节点多(笔记本、WSL、没有 tsIp 的那些),不是
      # deploy 节点的直接跳过 —— 用 `nix eval` 探一下有没有这个 attr,而不是在
      # 这里再维护一份主机名单(那种名单一定会和 mkDeployNodes 的判据漂移)。
      - name: Deploy schema (this host)
        run: |
          set -euo pipefail
          sys=x86_64-linux
          [ "${{ runner.os }}" = "macOS" ] && sys=aarch64-darwin
          attr=".#deployChecks.${sys}.deploy-schema-${{ matrix.host }}"
          if nix eval "$attr.drvPath" --raw >/dev/null 2>&1; then
            echo "验 ${{ matrix.host }} 的 deploy schema..."
            # **--dry-run,不是真 build。** deploy-rs 的 schema check 是
            #   runCommand { } "jsonschema -i ${writeText "deploy.json" (toJSON deploy)} ..."
            # 而 toJSON 出来的 profiles.*.path 是带 string context 的 store 路径,
            # 所以真 build 它 = 把这台的整个 system + home closure 全部拉下来。
            # 实测 shanghai 从 54s 涨到 4m35s。
            #
            # 原来的 `nix flake check --no-build` 也从没真跑过 jsonschema —— 它同样
            # 只求值。覆盖面全在求值这一步(deploy 节点的 profile 能不能求值出来),
            # 所以 --dry-run 是等价替换,不是降级。
            #
            # 真想跑那个 JSON schema 校验的话,得先 unsafeDiscardStringContext 把
            # 路径变成纯文本、自己重写一份 check —— 那是另一件事,别顺手在这里做。
            nix build "$attr" --dry-run
            echo "OK"
          else
            echo "${{ matrix.host }} 不是 deploy 节点(没有 tsIp),跳过。"
          fi

      # 每台先各自落一个 artifact,由下面的 summary job 拼成一张表。
      # 不直接往 $GITHUB_STEP_SUMMARY 写:那样会变成 17 个各写各的小片段,
      # 没法排序也没法一眼比较。
      - name: 上传概览行
        if: always() && steps.dryrun.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: row-${{ matrix.host }}
          path: /tmp/row.md
          retention-days: 1

  # ---------------------------------------------------------------------------
  # 汇总。always() —— 有 host 失败时更需要看到剩下那些的数字。
  # ---------------------------------------------------------------------------
  summary:
    name: 系统概览
    runs-on: ubuntu-latest
    needs: check-configurations
    if: always()
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: row-*
          path: /tmp/rows
          merge-multiple: false

      - name: 拼表
        run: |
          {
            echo "## 每台 host 的构建概览"
            echo
            echo "runner 的 nix store 是干净的，所以 **unpacked ≈ 这台的 system closure 大小**。"
            echo "\`to build\` 不为 0 表示这台上有 cache.nixos.org 和 imdomestic.cachix.org 都没有的东西"
            echo "（rpi4 的内核和 mihomo-smart 是预期之内的，见 \`flake.nix\` 的 packages 输出）。"
            echo
            echo "| host | arch | to build | to fetch | download / unpacked |"
            echo "| --- | --- | ---: | ---: | --- |"
            # 按 host 名排序，保证每次 run 的表顺序一致，diff 得动。
            # 行首都是 `| **`，纯字典序就够。
            find /tmp/rows -name row.md -print0 2>/dev/null \
              | xargs -0 -r cat \
              | sort \
              || echo "| — | — | — | — | 没有可用的数据 |"
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$GITHUB_STEP_SUMMARY"

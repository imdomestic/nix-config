apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: access
  namespace: argocd
spec:
  destination:
    namespace: kube-system
    server: https://kubernetes.default.svc
  project: default
  source:
    path: ./tank/access
    repoURL: https://github.com/imdomestic/nix-config.git
    targetRevision: k8s-rendered
  syncPolicy:
    automated:
      prune: true
      selfHeal: true

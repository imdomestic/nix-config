apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: agones
  namespace: argocd
spec:
  destination:
    namespace: agones-system
    server: https://kubernetes.default.svc
  project: default
  source:
    path: ./tank/agones
    repoURL: https://github.com/imdomestic/nix-config.git
    targetRevision: k8s-rendered
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true

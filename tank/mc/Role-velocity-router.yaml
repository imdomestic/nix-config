apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: velocity-router
  namespace: mc
rules:
  - apiGroups:
      - agones.dev
    resources:
      - gameservers
    verbs:
      - get
      - list
      - watch
      - delete
  - apiGroups:
      - allocation.agones.dev
    resources:
      - gameserverallocations
    verbs:
      - create

apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: lobby
  namespace: mc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lobby
  serviceName: lobby
  template:
    metadata:
      labels:
        app: lobby
    spec:
      containers:
        - env:
            - name: ALLOW_NETHER
              value: "FALSE"
            - name: CFG_FORWARDING_SECRET
              valueFrom:
                secretKeyRef:
                  key: secret
                  name: velocity-forwarding
            - name: ENFORCE_SECURE_PROFILE
              value: "FALSE"
            - name: EULA
              value: "TRUE"
            - name: JVM_XX_OPTS
              value: -XX:MaxRAMPercentage=75
            - name: MEMORY
              value: ""
            - name: MODE
              value: adventure
            - name: MOTD
              value: lobby
            - name: ONLINE_MODE
              value: "FALSE"
            - name: PAPER_BUILD
              value: "133"
            - name: PAUSE_WHEN_EMPTY_SECONDS
              value: "0"
            - name: SPAWN_PROTECTION
              value: "999"
            - name: TYPE
              value: PAPER
            - name: VERSION
              value: 1.21.1
          image: ghcr.io/imdomestic/mc-server:1lnpm6363pwl
          name: server
          ports:
            - containerPort: 25565
              name: minecraft
          readinessProbe:
            exec:
              command:
                - mc-health
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            limits:
              memory: 3Gi
            requests:
              memory: 3Gi
          volumeMounts:
            - mountPath: /config
              name: config
            - mountPath: /data
              name: data
      enableServiceLinks: false
      initContainers:
        - command:
            - sh
            - -c
            - '[ -e /data/.seeded ] || { cp -a /seed/. /data/ && touch /data/.seeded; }'
          image: busybox:1.37.0
          name: seed
          volumeMounts:
            - mountPath: /data
              name: data
            - mountPath: /seed
              name: seed
              readOnly: true
      volumes:
        - configMap:
            name: lobby-config
          name: config
        - hostPath:
            path: /data/srv/minecraft/lobby
            type: Directory
          name: seed
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 10Gi

apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: bingo
  namespace: mc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bingo
  serviceName: bingo
  template:
    metadata:
      labels:
        app: bingo
    spec:
      containers:
        - env:
            - name: ENFORCE_SECURE_PROFILE
              value: "FALSE"
            - name: EULA
              value: "TRUE"
            - name: FABRIC_LOADER_VERSION
              value: 0.19.5
            - name: FABRIC_PROXY_SECRET
              valueFrom:
                secretKeyRef:
                  key: secret
                  name: velocity-forwarding
            - name: JVM_XX_OPTS
              value: -XX:MaxRAMPercentage=75
            - name: MEMORY
              value: ""
            - name: MODS
              value: https://cdn.modrinth.com/data/P7dR8mSH/versions/DdVHbeR1/fabric-api-0.141.1%2B1.21.11.jar,https://cdn.modrinth.com/data/8dI2tmqs/versions/nR8AIdvx/FabricProxy-Lite-2.11.0.jar,https://cdn.modrinth.com/data/gvQqBUqZ/versions/gl30uZvp/lithium-fabric-0.21.2%2Bmc1.21.11.jar,https://cdn.modrinth.com/data/mHeNceaH/versions/Vb6yPYhc/bingo-2.9.7%2Bmc1.21.11.jar
            - name: MOTD
              value: bingo 1.21.11
            - name: ONLINE_MODE
              value: "FALSE"
            - name: TYPE
              value: FABRIC
            - name: VERSION
              value: 1.21.11
          image: itzg/minecraft-server:2026.9.2-java21
          name: server
          ports:
            - containerPort: 25565
              name: minecraft
          readinessProbe:
            exec:
              command:
                - mc-health
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            limits:
              memory: 4Gi
            requests:
              memory: 4Gi
          volumeMounts:
            - mountPath: /data
              name: data
      enableServiceLinks: false
      initContainers:
        - command:
            - sh
            - -c
            - '[ -e /data/.seeded ] || { cp -a /seed/. /data/ && touch /data/.seeded; }'
          image: busybox:1.37.0
          name: seed
          volumeMounts:
            - mountPath: /data
              name: data
            - mountPath: /seed
              name: seed
              readOnly: true
      volumes:
        - hostPath:
            path: /data/srv/minecraft/bingo
            type: Directory
          name: seed
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 10Gi

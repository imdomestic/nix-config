apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app: agones
    chart: agones-1.61.0
    heritage: Helm
    release: agones
  name: agones-controller
rules:
  - apiGroups:
      - ""
    resources:
      - events
    verbs:
      - create
      - patch
  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - create
      - update
      - delete
      - list
      - watch
  - apiGroups:
      - ""
    resources:
      - nodes
      - secrets
    verbs:
      - list
      - watch
  - apiGroups:
      - admissionregistration.k8s.io
    resources:
      - mutatingwebhookconfigurations
    verbs:
      - get
  - apiGroups:
      - apiextensions.k8s.io
    resources:
      - customresourcedefinitions
    verbs:
      - get
  - apiGroups:
      - agones.dev
    resources:
      - gameservers
      - gameserversets
    verbs:
      - create
      - delete
      - get
      - list
      - update
      - watch
  - apiGroups:
      - agones.dev
    resources:
      - gameservers
    verbs:
      - patch
  - apiGroups:
      - agones.dev
    resources:
      - fleets
    verbs:
      - get
      - list
      - update
      - watch
  - apiGroups:
      - agones.dev
    resources:
      - fleets/status
      - gameserversets/status
    verbs:
      - update
  - apiGroups:
      - agones.dev
    resources:
      - fleets/finalizers
      - gameserversets/finalizers
      - gameservers/finalizers
    verbs:
      - update
  - apiGroups:
      - multicluster.agones.dev
    resources:
      - gameserverallocationpolicies
    verbs:
      - create
      - delete
      - get
      - list
      - update
      - watch
  - apiGroups:
      - autoscaling.agones.dev
    resources:
      - fleetautoscalers
    verbs:
      - get
      - list
      - update
      - watch
  - apiGroups:
      - autoscaling.agones.dev
    resources:
      - fleetautoscalers/status
    verbs:
      - update
  - apiGroups:
      - coordination.k8s.io
    resources:
      - leases
    verbs:
      - create
      - delete
      - get
      - list
      - update
      - watch

apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  labels:
    app: agones
    chart: agones-1.61.0
    heritage: Helm
    release: agones
  name: agones-sdk-access
  namespace: mc
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: agones-sdk
subjects:
